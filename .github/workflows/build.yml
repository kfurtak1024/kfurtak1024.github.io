name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Lets the pipeline be exercised on demand without pushing a commit.
  workflow_dispatch:

# Default to read-only; the deploy job opts into more for itself alone.
permissions:
  contents: read

# Never let two deploys race each other onto the live site.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # This name is what the branch ruleset requires as a status check --
    # renaming it silently disables that protection.
    name: Build & verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The single signal for "this run is expected to carry production
      # secrets", derived from the event rather than from the secrets
      # themselves. Both the verify guard and the licence-nag assertion read it,
      # so they cannot drift apart -- and cannot quietly relax themselves.
      # workflow_dispatch counts too: the CV repository's release triggers a
      # manual run on main to redeploy with the new /cv.pdf.
      EXPECT_REAL_SECRETS: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
      # The `secrets` context cannot be read from a step-level `if`, so surface
      # availability as a plain env value the steps below can test.
      HAS_EMAIL_SECRET: ${{ secrets.MY_EMAIL_BASE64 != '' }}
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          # Keep in step with the "engines" floor in package.json, which is what
          # actually enforces a supported version at install time.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The CV lives in the private kfurtak1024/cv repository. Copy the public
      # PDF (no phone, no photo; the release's other files have them) from its
      # latest release into public/, which Vite ships verbatim as /cv.pdf.
      # Only runs expected to deploy are strict: a deploy without the file
      # would 404 every link already sent out, so there a failed download
      # fails the build, and Verify also requires the file. Everywhere else
      # (pull requests, forks, Dependabot) a missing CV is just a warning.
      - name: Fetch CV 📄
        env:
          GH_TOKEN: ${{ secrets.CV_REPO_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::CV_REPO_TOKEN was not available to this run; building without /cv.pdf."
            exit 0
          fi
          if gh release download --repo kfurtak1024/cv --pattern Krzysztof_Furtak_CV_public.pdf --output public/cv.pdf --clobber; then
            exit 0
          fi
          if [ "$EXPECT_REAL_SECRETS" = "true" ]; then
            echo "::error::Could not download the CV from kfurtak1024/cv. Check that a release exists and that CV_REPO_TOKEN is valid (fine-grained tokens expire)."
            exit 1
          fi
          echo "::warning::Could not download the CV (no release yet, or CV_REPO_TOKEN lacks access); building without /cv.pdf."

      # Secrets are passed as env vars, never interpolated into a shell
      # command, so values containing / + & " cannot corrupt the build. Where
      # they are absent (fork PRs) Vite falls back to the dev values in .env.
      - name: Build 🔧
        run: npm run build
        env:
          VITE_SITE_EMAIL_BASE64: ${{ secrets.MY_EMAIL_BASE64 }}

      # Without this, a PR that built on .env dev fallbacks goes green while the
      # eventual push to main fails at --require-secrets. Warn where it is seen.
      - name: Warn when built without real secrets
        if: env.HAS_EMAIL_SECRET != 'true'
        run: >
          echo "::warning::Built with the dev fallbacks from .env - MY_EMAIL_BASE64
          was not available to this run. Merging to main will fail at
          'Verify' until the repository secret is present."

      # Runs after the build because lint:html validates the built document.
      - name: Lint 🧹
        run: npm run lint

      # --require-secrets asserts the dev fallbacks are gone. It keys off the
      # event, NOT off whether the secret happens to be set: gating on the
      # secret's own presence would switch the check off in precisely the case
      # it exists to catch (a deleted or renamed secret shipping dev values).
      # Fork PRs get no secrets and do not deploy, so they stay lenient.
      - name: Verify 🔍
        run: >
          node scripts/verify.mjs
          ${{ env.EXPECT_REAL_SECRETS == 'true' && '--require-secrets' || '' }}

      # Browser binaries are large and version-pinned by the lockfile, so cache
      # them on it. `install` still runs -- it is a no-op on a cache hit, and
      # the OS-level --with-deps packages are not cacheable anyway.
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox

      # Runs against the dist/ built above, so it needs no secrets of its own.
      - name: Smoke test 🧪
        run: npm test

      # Both paths matter on a failure: playwright-report is the HTML report,
      # test-results holds the traces that `trace: 'on-first-retry'` records.
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
          if-no-files-found: warn

      # The deploy job publishes this exact artifact rather than rebuilding,
      # so what ships is byte-for-byte what passed the checks above.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy 🚀
    needs: build
    # THE guard: pull requests build and test, but only main ships -- on a
    # push, or on a manual run (which is how a CV release redeploys the site).
    # Keep in step with EXPECT_REAL_SECRETS above.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
